config:
  credentials: []
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/openaire/iis:
      branch: master
      repo: https://github.com/openaire/iis
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/openaire/iis git:
        commands:
        - /usr/bin/env sh .sqa/script.pineapple_generous_axolotl.sh
        container: qc.acc_fern_spirited_turtle
  QC.Doc:
    repos:
      github.com/openaire/iis find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.claret_savvy_crane.sh
        container: qc.doc_periwinkle_understanding_serval
      github.com/openaire/iis git:
        commands:
        - /usr/bin/env sh .sqa/script.magenta_articulate_cheetah.sh
        container: qc.doc_kiwi_nervous_catfish
      github.com/openaire/iis markdownlint:
        commands:
        - /usr/bin/env sh .sqa/script.ivory_serene_skunk.sh
        container: qc.doc_beige_supportive_boar
  QC.Lic:
    repos:
      github.com/openaire/iis licensee:
        commands:
        - /usr/bin/env sh .sqa/script.ivory_mindful_beaver.sh
        container: qc.lic_marina_artistic_shark
  QC.Sec:
    repos:
      github.com/openaire/iis bandit:
        commands:
        - /usr/bin/env sh .sqa/script.crimson_happy_porpoise.sh
        container: qc.sec_cornflower_dizzy_salamander
  QC.Sty:
    repos:
      github.com/openaire/iis checkstyle:
        commands:
        - /usr/bin/env sh .sqa/script.lagoon_skeptical_snail.sh
        container: qc.sty_claret_timid_serval
      github.com/openaire/iis flake8:
        commands:
        - /usr/bin/env sh .sqa/script.peach_articulate_alpaca.sh
        container: qc.sty_powder_mindful_termite
      github.com/openaire/iis jsonlint:
        commands:
        - /usr/bin/env sh .sqa/script.cerise_attentive_iguana.sh
        container: qc.sty_scarlet_peaceful_cormorant
  QC.Uni:
    repos:
      github.com/openaire/iis pytest:
        commands:
        - /usr/bin/env sh .sqa/script.currant_diligent_panda.sh
        container: qc.uni_mango_bright_chinchilla
  QC.Ver:
    repos:
      github.com/openaire/iis get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.taupe_brilliant_skunk.sh
        container: qc.ver_burgundy_diplomatic_unicorn
timeout: 5400
